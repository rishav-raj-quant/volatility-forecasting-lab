[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-forecasting-lab"
version = "1.0.0"
description = "Advanced Quantitative Volatility Forecasting & Financial Risk Analytics Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rishav Raj", email = "research@quantlab.internal" }
]
keywords = [
    "quantitative-finance",
    "volatility-forecasting",
    "garch",
    "har-rv",
    "machine-learning",
    "risk-management",
    "value-at-risk",
    "econometrics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "arch>=6.0.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "yfinance>=0.2.28",
    "pyarrow>=12.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.0.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "mypy>=1.5.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.25.0"
]

[project.scripts]
vol-lab = "volatility_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
