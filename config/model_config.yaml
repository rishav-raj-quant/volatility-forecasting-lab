econometrics:
  arch:
    lags: [1, 2, 5]
  garch:
    p: 1
    q: 1
    distributions: ["normal", "t"]
  egarch:
    p: 1
    q: 1
    distribution: "normal"
  gjr_garch:
    p: 1
    o: 1
    q: 1
    distribution: "normal"
  har_rv:
    daily_lag: 1
    weekly_lag: 5
    monthly_lag: 22

machine_learning:
  ridge:
    alpha: 1.0
  lasso:
    alpha: 0.01
  elastic_net:
    alpha: 0.01
    l1_ratio: 0.5
  random_forest:
    n_estimators: 150
    max_depth: 6
    min_samples_split: 5
    random_state: 42
  extra_trees:
    n_estimators: 150
    max_depth: 6
    min_samples_split: 5
    random_state: 42
  gradient_boosting:
    n_estimators: 120
    learning_rate: 0.03
    max_depth: 4
    random_state: 42
  xgboost:
    n_estimators: 120
    learning_rate: 0.03
    max_depth: 4
    subsample: 0.8
    random_state: 42
  lightgbm:
    n_estimators: 120
    learning_rate: 0.03
    max_depth: 4
    subsample: 0.8
    random_state: 42
  svr:
    kernel: "rbf"
    C: 1.0
    epsilon: 0.1

deep_learning:
  seq_length: 20
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  hidden_dim: 32
  num_layers: 2
  dropout: 0.2
  patience: 8
